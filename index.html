<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品條碼批量輸出與獨立編輯系統</title>
    <!-- 載入條碼與 QR Code 繪製套件 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!-- 載入 html2canvas (用於將標籤轉為圖片下載) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-green: #00805a;
            --primary-red: #e31837;
            --primary-orange: #f58220;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 16px;
            color: #1e293b;
        }

        .no-print {
            max-width: 960px;
            margin: 0 auto 20px auto;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--primary-green);
            margin-bottom: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .badge {
            background-color: var(--primary-red);
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* 工具箱按鈕列 */
        .tools-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-tool {
            padding: 10px;
            border: 1px solid var(--primary-green);
            background-color: #f0fdf4;
            color: var(--primary-green);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-tool:hover {
            background-color: var(--primary-green);
            color: #fff;
        }

        /* 可折疊隱藏進階工具列 */
        .collapsible-tools {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .btn-toggle-tools {
            background: none;
            border: none;
            color: #0284c7;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-toggle-tools:hover {
            background-color: #e0f2fe;
        }

        /* 鏡頭自動辨識預覽容器 */
        #scanner-container {
            display: none;
            position: relative;
            width: 100%;
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 3px solid var(--primary-green);
        }

        #video {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 12px;
        }

        .scan-status-tag {
            background: rgba(0, 128, 90, 0.92);
            color: #ffffff;
            font-size: 12px;
            padding: 5px 16px;
            border-radius: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }

        .flash-effect {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease-out;
            z-index: 15;
        }

        .close-scanner {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.65);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 感應靈敏度調整選單 */
        .sensitivity-bar-top {
            position: absolute;
            top: 8px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            z-index: 11;
        }

        .sensitivity-title {
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn-sens-group {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }

        .btn-sens {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.4);
            color: #ffffff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .btn-sens.active {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
            font-weight: bold;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 獨立商品修改控制區塊 */
        .editor-card {
            background-color: #f0fdf4;
            border: 2px solid var(--primary-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .editor-header {
            font-size: 13px;
            font-weight: bold;
            color: var(--primary-green);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.flex-2 { flex: 2; min-width: 160px; }
        .form-group.flex-3 { flex: 3; min-width: 200px; }
        .form-group.flex-1 { flex: 1; min-width: 80px; }

        .form-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
        }

        /* 批量清單展示 */
        .items-list-wrapper {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 12px;
        }

        .item-list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background 0.15s;
        }

        .item-list-row:hover {
            background-color: #f8fafc;
        }

        .item-list-row.active {
            background-color: #e6f2ed;
            border-left: 4px solid var(--primary-green);
        }

        .item-info {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }

        .item-note-text {
            font-weight: bold;
            color: #0f172a;
            min-width: 100px;
        }

        .item-barcode-text {
            color: #475569;
            font-family: monospace;
        }

        .item-format-badge {
            font-size: 10px;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .item-qty-badge {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            color: #334155;
        }

        /* 按鈕列樣式 */
        .layout-controls-container {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-block label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
        }

        .btn-toggle-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-toggle {
            flex: 1;
            min-width: 70px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            text-align: center;
        }

        .btn-toggle:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
        }

        .btn-toggle.active {
            background-color: var(--primary-green);
            color: #ffffff;
            border-color: var(--primary-green);
            box-shadow: 0 2px 4px rgba(0, 128, 90, 0.2);
        }

        input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            background-color: #fff;
        }

        textarea {
            height: 75px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        .btn-del {
            background: #fee2e2;
            color: var(--primary-red);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-del:hover {
            background: #fca5a5;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-green);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #006648;
        }

        .btn-save {
            background-color: #0284c7;
            color: white;
            border: none;
        }

        .btn-save:hover {
            background-color: #0369a1;
        }

        .btn-print {
            background-color: var(--primary-orange);
            color: white;
            border: none;
        }

        .btn-print:hover {
            background-color: #d96d13;
        }

        .status-msg {
            font-size: 12px;
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 8px;
            display: none;
            background-color: #e6f2ed;
            padding: 6px;
            border-radius: 6px;
        }

        #fileInput {
            display: none;
        }

        /* 輸出與排版區域 */
        .print-layout-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 960px;
            margin: 0 auto;
        }

        .barcode-grid {
            display: grid;
            gap: 12px;
            width: 100%;
        }

        .grid-cols-1 { grid-template-columns: repeat(1, 1fr); }
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }

        .barcode-card {
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            padding: 8px 10px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            page-break-inside: avoid;
            break-inside: avoid;
            overflow: hidden;
            min-height: 80px;
        }

        .download-single-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.05);
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .download-single-btn:hover {
            background: var(--primary-green);
            color: #ffffff;
            border-color: var(--primary-green);
        }

        .barcode-note-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
            min-height: 22px;
            overflow: hidden;
        }

        .barcode-note-text {
            font-weight: bold;
            color: #0f172a;
            white-space: nowrap;
            display: inline-block;
            line-height: 1.2;
        }

        .barcode-content-stacked {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .barcode-svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .qr-canvas-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
            min-height: 50px;
        }

        .qr-canvas-box canvas, .qr-canvas-box img {
            display: block !important;
            margin: 0 auto;
        }

        @media print {
            body {
                background-color: white;
                padding: 0;
                margin: 0;
            }
            .no-print, .download-single-btn {
                display: none !important;
            }
            .print-layout-container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .barcode-card {
                border: 1px solid #000 !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>

<div class="no-print">
    <div class="app-card">
        <div class="header">
            <h1>商品條碼批量輸出與獨立編輯系統 <span class="badge">通用版</span></h1>
        </div>

        <div class="tools-header">
            <span style="font-size: 13px; font-weight: bold; color: #334155;">🛠️ 快速辨識與匯入工具</span>
            <button class="btn-toggle-tools" onclick="toggleCollapsibleTools()">
                <span id="toolsToggleIcon">👁️ 顯示進階工具</span>
            </button>
        </div>

        <div class="tools-grid">
            <button class="btn-tool" onclick="startCameraScan()">📷 開啟自動辨識</button>
            <button class="btn-tool" onclick="document.getElementById('fileInput').click()">🖼️ 圖片檔辨識</button>
        </div>

        <div class="collapsible-tools" id="collapsibleToolsBlock">
            <button class="btn-tool" onclick="autoPasteAndRecognize()">📋 貼上辨識</button>
            <button class="btn-tool" onclick="batchImportPrompt()">📝 批量文字/備註匯入</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="scanImageFile(this)">

        <div id="scanner-container" style="margin-top: 12px;">
            <button class="close-scanner" onclick="stopCameraScan()">✕</button>
            <video id="video" playsinline></video>
            
            <div class="sensitivity-bar-top">
                <span class="sensitivity-title">感應靈敏度：</span>
                <div class="btn-sens-group">
                    <button class="btn-sens" onclick="setSensitivity(350)">標準</button>
                    <button class="btn-sens active" onclick="setSensitivity(180)">高靈敏</button>
                    <button class="btn-sens" onclick="setSensitivity(80)">極速</button>
                </div>
            </div>

            <div class="scan-overlay">
                <div class="scan-status-tag" id="scanStatusTag">🟢 自動辨識掃描中... 對準條碼即可自動帶入</div>
            </div>

            <div class="flash-effect" id="flashEffect"></div>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div class="editor-card" id="editorCard">
            <div class="editor-header">
                <span>✏️ 獨立商品修改專區 (目前修改：<span id="editingIndexText">第 1 項</span>)</span>
            </div>
            <div class="editor-row">
                <div class="form-group flex-2">
                    <label for="editNoteInput">條碼備註 (名稱/說明)</label>
                    <input type="text" id="editNoteInput" placeholder="例如：商品名稱" oninput="saveCurrentEdit()">
                </div>
                <div class="form-group flex-3">
                    <label for="editBarcodeInput">商品條碼 (Barcode)</label>
                    <input type="text" id="editBarcodeInput" placeholder="請輸入商品條碼" oninput="saveCurrentEdit()">
                </div>
                <div class="form-group flex-1">
                    <label for="editQtyInput">數量</label>
                    <input type="number" id="editQtyInput" min="1" max="99" oninput="saveCurrentEdit()">
                </div>
            </div>
        </div>

        <div class="section-title">
            <span>商品批量清單 (<span id="itemCount">1</span> 項 - 點選項目進行修改)</span>
            <button class="btn btn-primary" style="flex:none; padding:4px 10px;" onclick="addItemRow()">+ 新增品項</button>
        </div>

        <div class="items-list-wrapper" id="itemsListContainer"></div>

        <div class="section-title">
            <span>⚙️ 條碼模式與排版設定</span>
        </div>
        <div class="layout-controls-container">
            <div class="control-block">
                <label>條碼輸出類型 (控制一維、二維或組合顯示)</label>
                <div class="btn-toggle-group" id="barcodeTypeToggleGroup">
                    <button class="btn-toggle" data-type="ean8" onclick="setBarcodeType('ean8')">僅EAN-8</button>
                    <button class="btn-toggle" data-type="ean13" onclick="setBarcodeType('ean13')">僅EAN-13</button>
                    <button class="btn-toggle" data-type="code128" onclick="setBarcodeType('code128')">僅Code128</button>
                    <button class="btn-toggle" data-type="qrcode" onclick="setBarcodeType('qrcode')">僅二維條碼</button>
                    <button class="btn-toggle active" data-type="both" onclick="setBarcodeType('both')">一維 + 二維</button>
                </div>
            </div>

            <div class="control-block">
                <label>列印排版欄數 (Columns)</label>
                <div class="btn-toggle-group" id="columnsToggleGroup">
                    <button class="btn-toggle" onclick="setLayoutColumns(1)">單列 (1欄)</button>
                    <button class="btn-toggle active" onclick="setLayoutColumns(2)">雙列 (2欄)</button>
                    <button class="btn-toggle" onclick="setLayoutColumns(3)">三列 (3欄)</button>
                    <button class="btn-toggle" onclick="setLayoutColumns(4)">四列 (4欄)</button>
                </div>
            </div>

            <div class="control-block">
                <label>數量自動重複產生標籤</label>
                <div class="btn-toggle-group" id="repeatToggleGroup">
                    <button class="btn-toggle active" onclick="setRepeatQty(true)">是 (依數量複製多張)</button>
                    <button class="btn-toggle" onclick="setRepeatQty(false)">否 (僅顯示單張貼紙)</button>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn" onclick="clearAllItems()">🗑️ 清空列表</button>
            <button class="btn btn-save" onclick="downloadAllBarcodeImages()">📥 批量下載所有條碼圖片</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ 列印標籤貼紙 / 輸出 PDF</button>
        </div>

        <div class="section-title">
            <span>商品條碼數據 JSON (自動即時同步)</span>
        </div>
        <textarea id="jsonInput" spellcheck="false"></textarea>
    </div>
</div>

<div class="print-layout-container">
    <div id="outputHeader" style="text-align: center; margin-bottom: 12px; font-weight: bold; font-size: 14px;">
        商品條碼標籤列印預覽 (<span id="labelCountBadge">0</span> 張)
    </div>

    <div class="barcode-grid grid-cols-2" id="barcodeGrid"></div>
</div>

<script>
    let itemsData = [
        { note: "7-11一元購物袋", barcode: "20719128", quantity: 1 }
    ];
    let selectedIndex = 0;

    let currentBarcodeType = 'both';
    let currentLayoutColumns = 2;
    let currentRepeatQty = true;

    let isUpdatingFromJson = false;
    let codeReader = null;
    let nativeDetector = null;
    let mediaStream = null;
    let lastScannedCode = "";
    let lastScanTime = 0;
    let audioCtx = null;
    let animFrameId = null;
    let lastScanTimestamp = 0;
    let isProcessingFrame = false;
    let currentSensitivityMs = 180;
    let showCollapsibleTools = false;

    function toggleCollapsibleTools() {
        showCollapsibleTools = !showCollapsibleTools;
        const block = document.getElementById('collapsibleToolsBlock');
        const icon = document.getElementById('toolsToggleIcon');
        if (showCollapsibleTools) {
            block.style.display = 'grid';
            icon.innerText = '🙈 隱藏進階工具';
        } else {
            block.style.display = 'none';

    function playBeepSound() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        } catch (e) {
            console.log('Beep sound error:', e);
        }
    }

    function detectBarcodeFormat(barcodeStr) {
        const cleanStr = (barcodeStr || '').trim();
        if (/^\d{7,8}$/.test(cleanStr)) {
            return "EAN-8";
        } else if (/^\d{12,13}$/.test(cleanStr)) {
            return "EAN-13";
        } else {
            return "Code128";
        }
    }

    // 智慧取得一維條碼格式：完全依據條碼內容位數自動判斷，不受頂部輸出類型按鈕切換影響
    function getSmartBarcodeFormat(barcodeStr) {
        const clean = (barcodeStr || '').trim();
        if (/^\d{7,8}$/.test(clean)) {
            return "EAN8";
        } else if (/^\d{12,13}$/.test(clean)) {
            return "EAN13";
        } else {
            return "CODE128";
        }
    }

    function enhanceLightAndContrast(sourceCanvas) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = sourceCanvas.width;
        tempCanvas.height = sourceCanvas.height;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(sourceCanvas, 0, 0);

        const imgData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        const data = imgData.data;

        let totalLuminance = 0;
        const pixelCount = data.length / 4;
        for (let i = 0; i < data.length; i += 4) {
            totalLuminance += (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        }
        const avgLuminance = totalLuminance / pixelCount;

        let threshold = 120;
        if (avgLuminance < 80) {
            threshold = Math.max(60, avgLuminance * 1.2);
        } else if (avgLuminance > 170) {
            threshold = Math.min(200, avgLuminance * 0.85);
        }

        for (let i = 0; i < data.length; i += 4) {
            const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
            const val = lum > threshold ? 255 : 0;
            data[i] = val;
            data[i + 1] = val;
            data[i + 2] = val;
        }

        ctx.putImageData(imgData, 0, 0);
        return tempCanvas;
    }

    async function initBarcodeDecoders() {
        if ('BarcodeDetector' in window) {
            try {
                const supportedFormats = await BarcodeDetector.getSupportedFormats();
                if (supportedFormats && supportedFormats.length > 0) {
                    nativeDetector = new BarcodeDetector({ formats: supportedFormats });
                }
            } catch (e) {
                console.log('Native BarcodeDetector not available:', e);
            }
        }

        if (!codeReader) {
            const hints = new Map();
            const formats = [
                ZXing.BarcodeFormat.QR_CODE,
                ZXing.BarcodeFormat.DATA_MATRIX,
                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,
                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39,
                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E
            ];
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            codeReader = new ZXing.BrowserMultiFormatReader(hints);
        }
    }

    async function startCameraScan() {
        const container = document.getElementById('scanner-container');
        container.style.display = 'block';

        await initBarcodeDecoders();

        const deviceDpr = window.devicePixelRatio || 1;
        const constraints = {
            video: {
                facingMode: 'environment',
                width: { ideal: Math.round(1280 * deviceDpr) },
                height: { ideal: Math.round(720 * deviceDpr) },
                focusMode: { ideal: 'continuous' }
            }
        };

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            const video = document.getElementById('video');
            video.srcObject = mediaStream;
            await video.play();

            const snapCanvas = document.createElement('canvas');
            const snapCtx = snapCanvas.getContext('2d');

            if (animFrameId) cancelAnimationFrame(animFrameId);
            isProcessingFrame = false;

            const processLoop = async (timestamp) => {
                if (!mediaStream) return;

                if (video && video.videoWidth > 0 && video.readyState === 4) {
                    if (timestamp - lastScanTimestamp >= currentSensitivityMs && !isProcessingFrame) {
                        lastScanTimestamp = timestamp;
                        isProcessingFrame = true;

                        snapCanvas.width = video.videoWidth;
                        snapCanvas.height = video.videoHeight;
                        snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);

                        let detectedText = null;

                        if (nativeDetector) {
                            try {
                                const barcodes = await nativeDetector.detect(snapCanvas);
                                if (barcodes && barcodes.length > 0) {
                                    detectedText = barcodes[0].rawValue;
                                }
                            } catch (errNative) {}
                        }

                        if (!detectedText && codeReader) {
                            try {
                                const res = await codeReader.decodeFromCanvas(snapCanvas);
                                if (res && res.text) {
                                    detectedText = res.text.trim();
                                }
                            } catch (errZXing) {
                                try {
                                    const enhanced = enhanceLightAndContrast(snapCanvas);
                                    const res2 = await codeReader.decodeFromCanvas(enhanced);
                                    if (res2 && res2.text) {
                                        detectedText = res2.text.trim();
                                    }
                                } catch (errEnhanced) {}
                            }
                        }

                        if (detectedText) {
                            processScannedResult(detectedText);
                        }

                        isProcessingFrame = false;
                    }
                }

                animFrameId = requestAnimationFrame(processLoop);
            };

            animFrameId = requestAnimationFrame(processLoop);

        } catch (err) {
            alert('無法開啟相機鏡頭，請確認存取權限：' + err);
            stopCameraScan();
        }
    }

    function appendRecognizedBarcode(barcodeStr) {
        if (itemsData[selectedIndex] && (itemsData[selectedIndex].barcode === "" || itemsData[selectedIndex].barcode === undefined)) {
            itemsData[selectedIndex].barcode = barcodeStr;
        } else {
            itemsData.push({ note: "", barcode: barcodeStr, quantity: 1 });
            selectedIndex = itemsData.length - 1;
        }
        renderAll();
    }

    function processScannedResult(scannedBarcode) {
        if (!scannedBarcode) return;
        const now = Date.now();

        if (scannedBarcode === lastScannedCode && (now - lastScanTime) < 1500) {
            return;
        }

        lastScannedCode = scannedBarcode;
        lastScanTime = now;

        try {
            const data = JSON.parse(scannedBarcode);
            if (data && data.Goods && data.Goods[0] && Array.isArray(data.Goods[0].Commodity)) {
                const item = data.Goods[0].Commodity[0];
                if (item && item.Barcode) {
                    triggerFlashEffect();
                    playBeepSound();
                    appendRecognizedBarcode(String(item.Barcode));
                    if (item.Quantity) {
                        itemsData[selectedIndex].quantity = item.Quantity;
                    }
                    if (item.Note) {
                        itemsData[selectedIndex].note = item.Note;
                    }
                    renderAll();
                    focusOnEditNote();
                    showStatus(`📸 已成功解析條碼數據！自動帶入：${item.Barcode}`);
                    return;
                }
            }
        } catch (e) {}

        triggerFlashEffect();
        playBeepSound();
        appendRecognizedBarcode(scannedBarcode);
        focusOnEditNote();

        const detectedFormat = detectBarcodeFormat(scannedBarcode);
        showStatus(`📸 自動辨識成功！已自動帶入 [${detectedFormat}] 條碼：` + scannedBarcode);
    }

    function stopCameraScan() {
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
        if (codeReader) {
            try { codeReader.reset(); } catch(e){}
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        isProcessingFrame = false;
        document.getElementById('scanner-container').style.display = 'none';
    }

    async function scanImageFile(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = async () => {
            await initBarcodeDecoders();
            let scannedBarcode = null;

            if (nativeDetector) {
                try {
                    const barcodes = await nativeDetector.detect(img);
                    if (barcodes && barcodes.length > 0) {
                        scannedBarcode = barcodes[0].rawValue;
                    }
                } catch (e) {}
            }

            if (!scannedBarcode && codeReader) {
                try {
                    const result = await codeReader.decodeFromImageElement(img);
                    if (result && result.text) {
                        scannedBarcode = result.text.trim();
                    }
                } catch (e) {}
            }

            if (scannedBarcode) {
                playBeepSound();

                try {
                    const data = JSON.parse(scannedBarcode);
                    if (data && data.Goods && data.Goods[0] && Array.isArray(data.Goods[0].Commodity)) {
                        const item = data.Goods[0].Commodity[0];
                        if (item && item.Barcode) {
                            appendRecognizedBarcode(String(item.Barcode));
                            if (item.Quantity) itemsData[selectedIndex].quantity = item.Quantity;
                            if (item.Note) itemsData[selectedIndex].note = item.Note;
                            renderAll();
                            focusOnEditNote();
                            showStatus(`✅ 圖片數據解析成功！已自動帶入資訊`);
                            input.value = '';
                            return;
                        }
                    }
                } catch (e) {}

                appendRecognizedBarcode(scannedBarcode);
                focusOnEditNote();
                const detectedFormat = detectBarcodeFormat(scannedBarcode);
                showStatus(`✅ 圖片解析成功！已自動帶入 [${detectedFormat}] 條碼：` + scannedBarcode);
            } else {
                alert('圖片中未辨識出可讀取的條碼或 QR Code。');
            }
            input.value = '';
        };
    }

    async function autoPasteAndRecognize() {
        try {
            const text = await navigator.clipboard.readText();
            recognizeTextContent(text);
        } catch (err) {
            const text = prompt("請貼上包含條碼或相關資料的內容：");
            if (text) recognizeTextContent(text);

    function recognizeTextContent(text) {
        if (!text) return;
        text = text.trim();

        try {
            const data = JSON.parse(text);
            if (data && data.Goods && data.Goods[0] && Array.isArray(data.Goods[0].Commodity)) {
                itemsData = data.Goods[0].Commodity.map((c, i) => ({
                    note: c.Note || (i === 0 ? "7-11一元購物袋" : ""),
                    barcode: String(c.Barcode || ''),
                    quantity: c.Quantity || 1
                }));
                selectedIndex = 0;
                playBeepSound();
                renderAll();
                showStatus('✅ 已成功匯入數據');
                return;
            }
        } catch (e) {}

        const matches = text.match(/\b\d{7,14}\b/g);
        if (matches && matches.length > 0) {
            playBeepSound();
            matches.forEach(bc => appendRecognizedBarcode(bc));
            showStatus(`✅ 已從剪貼簿解析並新增 ${matches.length} 筆條碼`);
        } else {
            alert('未能在輸入內容中識別出有效條碼！');
        }
    }

    function batchImportPrompt() {
        const input = prompt("請貼上批量資料 (每行一筆，格式如：備註,條碼,數量 或 條碼,數量)：\n範例：\n7-11一元購物袋,20719128,2\n87654321,1");
        if (!input) return;

        const lines = input.split('\n');
        const newItems = [];

        lines.forEach((line, idx) => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const parts = trimmed.split(/[\s,\t]+/);
            if (parts.length >= 3) {
                newItems.push({ note: parts[0], barcode: parts[1], quantity: parseInt(parts[2], 10) || 1 });
            } else if (parts.length === 2) {
                if (/^\d+$/.test(parts[0])) {
                    newItems.push({ note: idx === 0 ? "7-11一元購物袋" : "", barcode: parts[0], quantity: parseInt(parts[1], 10) || 1 });
                } else {
                    newItems.push({ note: parts[0], barcode: parts[1], quantity: 1 });
                }
            } else if (parts.length === 1 && parts[0]) {
                newItems.push({ note: idx === 0 ? "7-11一元購物袋" : "", barcode: parts[0], quantity: 1 });
            }
        });

        if (newItems.length > 0) {
            itemsData = newItems;
            selectedIndex = 0;
            playBeepSound();
            renderAll();
            showStatus(`✅ 已成功匯入 ${newItems.length} 筆資料`);
        } else {
            alert('無法解析輸入的內容！');
        }
    }

    function adjustNoteFontSizes() {
        const containers = document.querySelectorAll('.barcode-note-container');
        containers.forEach(container => {
            const textEl = container.querySelector('.barcode-note-text');
            if (!textEl) return;

            const containerWidth = container.clientWidth - 12;
            if (containerWidth <= 0) return;

            let maxFont = 16;
            let minFont = 9;

            if (currentLayoutColumns === 3) maxFont = 14;
            if (currentLayoutColumns === 4) maxFont = 12;

            let currentFont = maxFont;
            textEl.style.fontSize = currentFont + 'px';

            while (textEl.offsetWidth > containerWidth && currentFont > minFont) {
                currentFont -= 0.5;
                textEl.style.fontSize = currentFont + 'px';
            }
        });
    }

            if (show1D && labelItem.barcode) {
                const svgId = `#svg-code-${idx}`;
                // 強制使用智慧自動偵測格式，不受頂部輸出類型按鈕影響
                let formatToUse = getSmartBarcodeFormat(labelItem.barcode);

                try {
                    JsBarcode(svgId, labelItem.barcode, {
                        format: formatToUse,
                        lineColor: "#000",
                        width: barWidth,
                        height: show2D ? Math.max(28, barHeight - 14) : barHeight,
                        displayValue: true,
                        fontSize: currentLayoutColumns >= 3 ? 11 : 12,
                        margin: 2
                    });
                } catch (e) {
                    try {
                        JsBarcode(svgId, labelItem.barcode, {
                            format: "CODE128",
                            lineColor: "#000",
                            width: barWidth,
                            height: show2D ? Math.max(28, barHeight - 14) : barHeight,
                            displayValue: true,
                            fontSize: currentLayoutColumns >= 3 ? 11 : 12,
                            margin: 2
                        });
                    } catch (err) {
                        console.error("Barcode Render Error:", err);
                    }
                }
            }

            if (show2D && labelItem.barcode) {
                const formattedBarcode = /^\d+$/.test(labelItem.barcode) ? Number(labelItem.barcode) : labelItem.barcode;
                
                const itemJsonObj = {
                    "Goods": [
                        {
                            "Commodity": [
                                {
                                    "Device": "System",
                                    "Barcode": formattedBarcode,
                                    "Quantity": labelItem.quantity || 1
                                }
                            ]
                        }
                    ]
                };
                const itemJson = JSON.stringify(itemJsonObj);

                const targetQrWidth = show1D ? Math.max(50, qrWidth - 20) : qrWidth;

                setTimeout(() => {
                    const qrBox = document.getElementById(`qr-box-${idx}`);
                    if (qrBox) {
                        qrBox.innerHTML = "";
                        try {
                            new QRCode(qrBox, {
                                text: itemJson,
                                width: targetQrWidth,
                                height: targetQrWidth,
                                colorDark: "#000000",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.M
                            });
                        } catch (qrErr) {
                            console.error("QRCode Render Error:", qrErr);
                        }
                    }
                }, 15);
            }
        });

        setTimeout(adjustNoteFontSizes, 40);
    }

    function addItemRow() {
        itemsData.push({ note: "", barcode: "", quantity: 1 });
        selectedIndex = itemsData.length - 1;
        renderAll();
    }

    function removeItemRow(index) {
        if (itemsData.length <= 1) {
            alert('至少需保留一項商品！');
            return;
        }
        itemsData.splice(index, 1);
        if (selectedIndex >= itemsData.length) {
            selectedIndex = Math.max(0, itemsData.length - 1);
        }
        renderAll();
    }

    function clearAllItems() {
        itemsData = [{ note: "", barcode: "", quantity: 1 }];
        selectedIndex = 0;
        renderAll();
    }

    function syncDataToJSON() {
        if (isUpdatingFromJson) return;

        const commodityArray = itemsData.map(item => {
            const formattedBarcode = /^\d+$/.test(item.barcode) ? Number(item.barcode) : item.barcode;
            return {
                "Device": "System",
                "Barcode": formattedBarcode,
                "Quantity": item.quantity,
                "Note": item.note || ""
            };
        });

        const jsonObj = {
            "Goods": [
                {
                    "Commodity": commodityArray
                }
            ]
        };

        const jsonString = JSON.stringify(jsonObj, null, 2);
        document.getElementById('jsonInput').value = jsonString;
    }

    function syncJSONToData() {
        if (isUpdatingFromJson) return;

        const jsonText = document.getElementById('jsonInput').value.trim();
        try {
            const parsed = JSON.parse(jsonText);
            if (parsed && parsed.Goods && parsed.Goods[0] && Array.isArray(parsed.Goods[0].Commodity)) {
                isUpdatingFromJson = true;
                itemsData = parsed.Goods[0].Commodity.map((c, i) => ({
                    note: c.Note || "",
                    barcode: String(c.Barcode || ''),
                    quantity: c.Quantity || 1
                }));
                if (selectedIndex >= itemsData.length) selectedIndex = 0;
                renderItemsListUI();
                renderLayoutGridUI();
                isUpdatingFromJson = false;
            }
        } catch (e) {}
    }

    function renderAll() {
        renderItemsListUI();
        syncDataToJSON();
        renderLayoutGridUI();
    }

    window.onload = function() {
        renderAll();
        document.getElementById('jsonInput').addEventListener('input', syncJSONToData);
        window.addEventListener('resize', adjustNoteFontSizes);
    };
</script>

</body>
</html>
