<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-11 條碼批量輸出與自動排版系統</title>
    <!-- 載入條碼與 QR Code 繪製套件 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root {
            --711-green: #00805a;
            --711-red: #e31837;
            --711-orange: #f58220;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 16px;
            color: #1e293b;
        }

        .no-print {
            max-width: 900px;
            margin: 0 auto 20px auto;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--711-green);
            margin-bottom: 16px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .badge {
            background-color: var(--711-red);
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* 自動辨識與工具按鈕 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-tool {
            padding: 10px;
            border: 1px solid var(--711-green);
            background-color: #f0fdf4;
            color: var(--711-green);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-tool:hover {
            background-color: var(--711-green);
            color: #fff;
        }

        /* 鏡頭掃描預覽 */
        #scanner-container {
            display: none;
            position: relative;
            width: 100%;
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #video {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .close-scanner {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 控制排版設定選項區 */
        .layout-controls {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            background-color: #fff;
        }

        /* 批量表格 */
        .table-wrapper {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: white;
        }

        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }

        th {
            background: #f8fafc;
            color: #64748b;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        textarea {
            height: 75px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        .btn-del {
            background: #fee2e2;
            color: var(--711-red);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-del:hover {
            background: #fca5a5;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--711-green);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: #006648;
        }

        .btn-print {
            background-color: var(--711-orange);
            color: white;
            border: none;
        }

        .btn-print:hover {
            background-color: #d96d13;
        }

        .status-msg {
            font-size: 12px;
            color: var(--711-green);
            text-align: center;
            margin-bottom: 8px;
            display: none;
            background-color: #e6f2ed;
            padding: 6px;
            border-radius: 6px;
        }

        #fileInput {
            display: none;
        }

        /* 輸出與排版區域 (Print Layout Preview) */
        .print-layout-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 0 auto;
        }

        /* A4 紙張動態網格樣式 */
        .barcode-grid {
            display: grid;
            gap: 12px;
            width: 100%;
        }

        /* 各種排版模式之網格欄數 */
        .grid-cols-1 { grid-template-columns: repeat(1, 1fr); }
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }

        /* 標籤卡片樣式 */
        .barcode-card {
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            padding: 10px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            box-sizing: border-box;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .barcode-card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .barcode-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .barcode-svg {
            max-width: 100%;
            height: auto;
        }

        .qr-canvas-box {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 列印媒體 CSS (自動調整至 A4 貼紙) */
        @media print {
            body {
                background-color: white;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-layout-container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .barcode-card {
                border: 1px solid #000 !important; /* 列印時保留清晰實線或邊框 */
            }
            /* 列印分頁防中斷 */
            .barcode-card {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>

<!-- 操作與輸入主面板 (列印時會自動隱藏) -->
<div class="no-print">
    <div class="app-card">
        <div class="header">
            <h1>7-11 條碼批量輸出與自動排版系統 <span class="badge">POS 專用</span></h1>
        </div>

        <!-- 自動辨識工具箱 -->
        <div class="tools-grid">
            <button class="btn-tool" onclick="startCameraScan()">📷 鏡頭掃描</button>
            <button class="btn-tool" onclick="document.getElementById('fileInput').click()">🖼️ 圖片辨識</button>
            <button class="btn-tool" onclick="autoPasteAndRecognize()">📋 貼上辨識</button>
            <button class="btn-tool" onclick="batchImportPrompt()">📝 批量文字匯入</button>
        </div>

        <input type="file" id="fileInput" accept="image/*" onchange="scanImageFile(this)">

        <!-- 鏡頭即時預覽區域 -->
        <div id="scanner-container">
            <button class="close-scanner" onclick="stopCameraScan()">✕</button>
            <video id="video"></video>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <!-- 列印與條碼切換控制項 -->
        <div class="section-title">
            <span>⚙️ 條碼模式與排版設定</span>
        </div>
        <div class="layout-controls">
            <div class="control-group">
                <label for="barcodeTypeSelect">條碼輸出類型</label>
                <select id="barcodeTypeSelect" onchange="renderAll()">
                    <option value="code128">一維條碼 (Code128)</option>
                    <option value="qrcode">二維條碼 (QR Code - 單品項)</option>
                    <option value="both">一維 + 二維 組合標籤</option>
                    <option value="total_qr">全合一 (所有商品合為一個 QR Code)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="layoutColumnsSelect">列印排版欄數 (Columns)</label>
                <select id="layoutColumnsSelect" onchange="renderAll()">
                    <option value="1">單列 (1 欄 - 適合大標籤/清單)</option>
                    <option value="2" selected>雙列 (2 欄 - 適合標準貼紙)</option>
                    <option value="3">三列 (3 欄 - 適合小型標籤)</option>
                    <option value="4">四列 (4 欄 - 微型貼紙紙張)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="repeatQtyToggle">數量自動重複產生標籤</label>
                <select id="repeatQtyToggle" onchange="renderAll()">
                    <option value="true" selected>是 (依商品數量複製多張貼紙)</option>
                    <option value="false">否 (每項商品僅顯示一張貼紙)</option>
                </select>
            </div>
        </div>

        <!-- 批量編輯表格 -->
        <div class="section-title">
            <span>商品批量清單 (<span id="itemCount">1</span> 項)</span>
            <button class="btn btn-primary" style="flex:none; padding:4px 10px;" onclick="addItemRow()">+ 新增品項</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">項次</th>
                        <th>商品條碼 (Barcode)</th>
                        <th style="width: 90px;">數量</th>
                        <th style="width: 60px;">操作</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody">
                    <!-- 動態渲染品項列 -->
                </tbody>
            </table>
        </div>

        <div class="action-btns">
            <button class="btn" onclick="clearAllItems()">🗑️ 清空列表</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ 列印標籤貼紙 / 輸出 PDF</button>
        </div>

        <!-- JSON 數據同步預覽 -->
        <div class="section-title">
            <span>7-11 POS 數據 JSON (自動即時同步)</span>
        </div>
        <textarea id="jsonInput" spellcheck="false"></textarea>
    </div>
</div>

<!-- 批量條碼排版與預覽輸出區塊 -->
<div class="print-layout-container">
    <div id="outputHeader" style="text-align: center; margin-bottom: 12px; font-weight: bold; font-size: 14px;">
        7-11 結帳條碼標籤列印預覽 (<span id="labelCountBadge">0</span> 張)
    </div>

    <!-- 自動網格排版容器 -->
    <div class="barcode-grid grid-cols-2" id="barcodeGrid">
        <!-- 動態渲染貼紙卡片 -->
    </div>
</div>

<script>
    let itemsData = [
        { barcode: "20719128", quantity: 1 }
    ];
    let isUpdatingFromJson = false;
    let codeReader = null;

    // 顯示提示訊息
    function showStatus(text) {
        const msg = document.getElementById('statusMsg');
        msg.innerText = text;
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3500);
    }

    // 1. 鏡頭即時條碼掃描
    function startCameraScan() {
        const container = document.getElementById('scanner-container');
        container.style.display = 'block';

        if (!codeReader) {
            codeReader = new ZXing.BrowserMultiFormatReader();
        }

        codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
            if (result) {
                const scannedBarcode = result.text.trim();
                appendRecognizedBarcode(scannedBarcode);
                showStatus('✅ 掃描成功！已新增條碼：' + scannedBarcode);
                stopCameraScan();
            }
        }).catch(err => {
            alert('無法啟用相機鏡頭：' + err);
            stopCameraScan();
        });
    }

    function stopCameraScan() {
        if (codeReader) {
            codeReader.reset();
        }
        document.getElementById('scanner-container').style.display = 'none';
    }

    // 2. 上傳圖片檔案辨識條碼
    function scanImageFile(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);

        img.onload = () => {
            if (!codeReader) {
                codeReader = new ZXing.BrowserMultiFormatReader();
            }
            codeReader.decodeFromImageElement(img)
                .then(result => {
                    const scannedBarcode = result.text.trim();
                    appendRecognizedBarcode(scannedBarcode);
                    showStatus('✅ 圖片解析成功！已新增條碼：' + scannedBarcode);
                })
                .catch(err => {
                    alert('圖片中未找到可讀取的條碼或 QR Code。');
                })
                .finally(() => {
                    input.value = '';
                });
        };
    }

    // 3. 剪貼簿與文字自動辨識
    async function autoPasteAndRecognize() {
        try {
            const text = await navigator.clipboard.readText();
            recognizeTextContent(text);
        } catch (err) {
            const text = prompt("請貼上包含條碼或 7-11 JSON 的內容：");
            if (text) recognizeTextContent(text);
        }
    }

    // 解析文字內容
    function recognizeTextContent(text) {
        if (!text) return;
        text = text.trim();

        // 嘗試解析 JSON
        try {
            const data = JSON.parse(text);
            if (data && data.Goods && data.Goods[0] && Array.isArray(data.Goods[0].Commodity)) {
                itemsData = data.Goods[0].Commodity.map(c => ({
                    barcode: String(c.Barcode || ''),
                    quantity: c.Quantity || 1
                }));
                renderAll();
                showStatus('✅ 已成功匯入 7-11 POS JSON 數據');
                return;
            }
        } catch (e) {}

        // 提取連續數字條碼
        const matches = text.match(/\b\d{8,14}\b/g);
        if (matches && matches.length > 0) {
            matches.forEach(bc => appendRecognizedBarcode(bc));
            showStatus(`✅ 已從剪貼簿解析並新增 ${matches.length} 筆條碼`);
        } else {
            alert('未能在輸入內容中識別出有效條碼！');
        }
    }

    // 批量文字匯入選單
    function batchImportPrompt() {
        const input = prompt("請貼上批量資料 (每行一筆，格式例如：\n20719128,1\n4710088431021,2):");
        if (!input) return;

        const lines = input.split('\n');
        const newItems = [];

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const parts = trimmed.split(/[\s,\t]+/);
            if (parts.length >= 1 && parts[0]) {
                const bc = parts[0];
                const qty = parts[1] ? (parseInt(parts[1], 10) || 1) : 1;
                newItems.push({ barcode: bc, quantity: qty });
            }
        });

        if (newItems.length > 0) {
            itemsData = newItems;
            renderAll();
            showStatus(`✅ 已成功匯入 ${newItems.length} 筆資料`);
        } else {
            alert('無法解析輸入的內容！');
        }
    }

    function appendRecognizedBarcode(barcodeStr) {
        const lastIndex = itemsData.length - 1;
        if (itemsData[lastIndex] && itemsData[lastIndex].barcode === "") {
            itemsData[lastIndex].barcode = barcodeStr;
        } else {
            itemsData.push({ barcode: barcodeStr, quantity: 1 });
        }
        renderAll();
    }

    // 渲染表格 UI
    function renderTableUI() {
        const tbody = document.getElementById('itemTableBody');
        tbody.innerHTML = '';

        itemsData.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>#${index + 1}</td>
                <td>
                    <input type="text" value="${item.barcode}" placeholder="請輸入商品條碼" oninput="updateItemData(${index}, 'barcode', this.value)">
                </td>
                <td>
                    <input type="number" value="${item.quantity}" min="1" max="99" oninput="updateItemData(${index}, 'quantity', this.value)">
                </td>
                <td>
                    <button class="btn-del" onclick="removeItemRow(${index})">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('itemCount').innerText = itemsData.length;
    }

    // 核心：依據排版與條碼設定渲染網格貼紙
    function renderLayoutGridUI() {
        const grid = document.getElementById('barcodeGrid');
        grid.innerHTML = '';

        const barcodeType = document.getElementById('barcodeTypeSelect').value;
        const columns = document.getElementById('layoutColumnsSelect').value;
        const repeatQty = document.getElementById('repeatQtyToggle').value === 'true';

        // 設定網格欄數 Class
        grid.className = `barcode-grid grid-cols-${columns}`;

        // 1. 如果選取「全合一」QR Code 模式
        if (barcodeType === 'total_qr') {
            const jsonText = document.getElementById('jsonInput').value;
            const card = document.createElement('div');
            card.className = 'barcode-card';
            card.style.gridColumn = '1 / -1'; // 跨滿全欄
            card.innerHTML = `
                <div class="barcode-card-header">
                    <span>7-11 全品項結帳 QR Code</span>
                    <span>共 ${itemsData.length} 品項</span>
                </div>
                <div class="qr-canvas-box" id="total-qr-box"></div>
            `;
            grid.appendChild(card);

            if (jsonText) {
                new QRCode(document.getElementById('total-qr-box'), {
                    text: jsonText,
                    width: 200,
                    height: 200,
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
            document.getElementById('labelCountBadge').innerText = "1 (全合一)";
            return;
        }

        // 2. 展開要輸出的清單陣列（是否重複）
        let printList = [];
        itemsData.forEach((item, index) => {
            const count = repeatQty ? (item.quantity || 1) : 1;
            for (let i = 0; i < count; i++) {
                printList.push({
                    originalIndex: index,
                    barcode: item.barcode,
                    quantity: item.quantity,
                    copySeq: i + 1
                });
            }
        });

        document.getElementById('labelCountBadge').innerText = printList.length;

        // 3. 逐一建立標籤卡片
        printList.forEach((labelItem, idx) => {
            const card = document.createElement('div');
            card.className = 'barcode-card';

            const seqText = repeatQty && labelItem.quantity > 1 ? ` (${labelItem.copySeq}/${labelItem.quantity})` : '';

            let contentHTML = '';
            if (barcodeType === 'code128') {
                contentHTML = `<svg id="svg-code-${idx}" class="barcode-svg"></svg>`;
            } else if (barcodeType === 'qrcode') {
                contentHTML = `<div class="qr-canvas-box" id="qr-box-${idx}"></div>`;
            } else if (barcodeType === 'both') {
                contentHTML = `
                    <div class="barcode-content">
                        <svg id="svg-code-${idx}" class="barcode-svg" style="max-width:60%;"></svg>
                        <div class="qr-canvas-box" id="qr-box-${idx}"></div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="barcode-card-header">
                    <span>品項 #${labelItem.originalIndex + 1}${seqText}</span>
                    <span>7-11 POS</span>
                </div>
                ${contentHTML}
            `;
            grid.appendChild(card);

            // 繪製一維條碼
            if ((barcodeType === 'code128' || barcodeType === 'both') && labelItem.barcode) {
                try {
                    JsBarcode(`#svg-code-${idx}`, labelItem.barcode, {
                        format: "CODE128",
                        lineColor: "#000",
                        width: columns >= 3 ? 1.4 : 1.8,
                        height: columns >= 3 ? 45 : 55,
                        displayValue: true,
                        fontSize: 12,
                        margin: 2
                    });
                } catch (e) {
                    console.error("JsBarcode Error", e);
                }
            }

            // 繪製二維條碼
            if (barcodeType === 'qrcode' || barcodeType === 'both') {
                const itemJson = JSON.stringify({
                    "Goods": [{
                        "Commodity": [{
                            "Device": "POS",
                            "Barcode": /^\d+$/.test(labelItem.barcode) ? Number(labelItem.barcode) : labelItem.barcode,
                            "Quantity": 1
                        }]
                    }]
                });

                const qrBox = document.getElementById(`qr-box-${idx}`);
                if (qrBox) {
                    new QRCode(qrBox, {
                        text: itemJson,
                        width: columns >= 3 ? 80 : 100,
                        height: columns >= 3 ? 80 : 100,
                        correctLevel: QRCode.CorrectLevel.M
                    });
                }
            }
        });
    }

    // 更新資料列
    function updateItemData(index, key, value) {
        if (key === 'quantity') {
            itemsData[index][key] = parseInt(value, 10) || 1;
        } else {
            itemsData[index][key] = value.trim();
        }
        syncDataToJSON();
        renderLayoutGridUI();
    }

    function addItemRow() {
        itemsData.push({ barcode: "", quantity: 1 });
        renderAll();
    }

    function removeItemRow(index) {
        if (itemsData.length <= 1) {
            alert('至少需保留一項商品！');
            return;
        }
        itemsData.splice(index, 1);
        renderAll();
    }

    function clearAllItems() {
        itemsData = [{ barcode: "", quantity: 1 }];
        renderAll();
    }

    // 同步資料至 JSON
    function syncDataToJSON() {
        if (isUpdatingFromJson) return;

        const commodityArray = itemsData.map(item => {
            const formattedBarcode = /^\d+$/.test(item.barcode) ? Number(item.barcode) : item.barcode;
            return {
                "Device": "POS",
                "Barcode": formattedBarcode,
                "Quantity": item.quantity
            };
        });

        const jsonObj = {
            "Goods": [
                {
                    "Commodity": commodityArray
                }
            ]
        };

        const jsonString = JSON.stringify(jsonObj, null, 2);
        document.getElementById('jsonInput').value = jsonString;
    }

    // 從 JSON 反向同步回表格
    function syncJSONToData() {
        if (isUpdatingFromJson) return;

        const jsonText = document.getElementById('jsonInput').value.trim();
        try {
            const parsed = JSON.parse(jsonText);
            if (parsed && parsed.Goods && parsed.Goods[0] && Array.isArray(parsed.Goods[0].Commodity)) {
                isUpdatingFromJson = true;
                itemsData = parsed.Goods[0].Commodity.map(c => ({
                    barcode: String(c.Barcode || ''),
                    quantity: c.Quantity || 1
                }));
                renderTableUI();
                renderLayoutGridUI();
                isUpdatingFromJson = false;
            }
        } catch (e) {}
    }

    function renderAll() {
        renderTableUI();
        syncDataToJSON();
        renderLayoutGridUI();
    }

    window.onload = function() {
        renderAll();
        document.getElementById('jsonInput').addEventListener('input', syncJSONToData);
    };
</script>

</body>
</html>
